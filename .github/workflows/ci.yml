name: CI

# Compilation et tests à chaque poussée sur la branche principale et sur les PR.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Lecture seule : la CI compile, teste et dépose un artefact, rien de plus.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v7

      - name: Installer le SDK .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100'

      - name: Restaurer les dépendances
        run: dotnet restore MisterGPhotos.sln

      - name: Compiler (Release)
        run: dotnet build MisterGPhotos.sln -c Release --no-restore

      - name: Tests
        run: dotnet test src/MisterGPhotos.Tests/MisterGPhotos.Tests.csproj -c Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Publier les résultats de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultats-tests
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
